name: build

on:
  schedule:
    # Hourly at :05 to avoid the top-of-hour cron stampede on GitHub.
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      - name: Commit changes if any
        run: |
          git config user.name  "hantavirus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/data.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "build: refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
