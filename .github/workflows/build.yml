name: build

on:
  schedule:
    # Daily at 06:05 UTC, not hourly.
    #
    # This was `5 * * * *`. Each run is two jobs (build + deploy) and each job
    # rounds up to a full billed minute, so ~6 runs a day cost ~12-15 billed
    # minutes a day and roughly 400 a month -- measurably the largest single
    # line on the account's usage page on days when no CI ran at all (12 min on
    # 2026-09-01, 15 on the 2nd, 15 on the 3rd, all of it this workflow).
    #
    # Nothing here publishes hourly. ProMED, Google News and the CDC do not
    # update on an hourly cadence, and the build re-derives the whole site from
    # source each time, so a daily pass loses no data. The workflow is
    # currently disabled; this is so re-enabling it cannot reintroduce the
    # drain. Drop to hourly only if the site is being actively watched during
    # an outbreak.
    - cron: "5 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          # Optional. Absent secret => the Bluesky bot no-ops and the build
          # still succeeds (forks and PRs don't get secrets).
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python build.py

      # We don't commit the regenerated docs/ back to the repo — the
      # Pages artifact deploy is the source of truth. This avoids races
      # with manual pushes during development.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
