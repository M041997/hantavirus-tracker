name: build

on:
  schedule:
    # Hourly at :05 to avoid the top-of-hour cron stampede on GitHub.
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      - name: Commit changes if any
        run: |
          git config user.name  "hantavirus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/data.json
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "build: refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          # Race with manual pushes: rebase + retry up to 3 times.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i), rebasing onto remote..."
            git fetch origin main
            git rebase --strategy-option=ours origin/main || git rebase --abort
          done
          # Don't fail the workflow: artifact upload + Pages deploy still work
          # from the locally-built docs/ even without the commit landing.
          echo "::warning::Could not push commit after retries; site will still deploy from artifact."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
